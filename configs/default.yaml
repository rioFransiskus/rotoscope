# Parameter pipeline (stage [1b], [2]–[4] + export [6]).Nilai = default kode (src/rotoscope/config.py) = docs/02.
# Ubah default: ubah ketiganya (dicek tests/test_config.py). Untuk eksperimen, salin file ini.

# ── PATHS ──────────────────────────────────────────
paths:
  # Relatif → terhadap direktori kerja (cwd) saat load. Path Windows: pakai "/" atau kutip TUNGGAL.
  #   work_dir: "D:/rotoscope/work"   → OK
  #   work_dir: 'D:\rotoscope\work'   → OK
  #   work_dir: "D:\rotoscope\new"    → ERROR: di kutip GANDA backslash = escape ("\r", "\n" = kontrol)
  work_dir: "work"           # boleh di drive lain (±1–5 GB per klip)
  out_dir: "out"

# ── STYLE (stage [5] dan kertas di [6]) ────────────
# Nama preset di configs/styles/<nama>.yaml (rough-sketch, clean-line, heavy-marker, pencil-light) ATAU path YAML (relatif → cwd).
# Nama dicari relatif ke root project (folder pyproject.toml), peka huruf besar-kecil. Flag --style mengalahkan kunci ini (T-406).
style: "rough-sketch"

# ── INGEST [1] — saran crop (T-607, D-013) ─────────
# Ingest TIDAK pernah memotong sendiri: deteksi R2 (rentang penuh sumber) → saran + pratinjau di <work_dir>/crop/<nama>/;
# kotak dipakai hanya bila diterima: python -m rotoscope crop <video> --accept | --box X Y W H | --none. Trim: --start / --end.
ingest:
  crop:
    suggest: true              # false = tanpa deteksi / saran; run tidak berhenti
    detect:                    # aturan R2 BEKU (docs/04 "R2 DIBEKUKAN"); nilai lain = PERINGATAN "aturan belum divalidasi"
      static_std_max: 3.0      # piksel statis: simpangan baku temporal (0–255) ≤ ini
      static_line_frac: 0.99   # baris / kolom statis: ≥ fraksi ini pikselnya statis
      uniform_std_max: 6.0     # pita seragam: simpangan baku spasial warna ≤ ini
      band_min_px: 8           # pita minimum per sisi + syarat pasangan (atas + bawah / kiri + kanan)
      min_active_frac: 0.10    # area aktif < fraksi frame ini → tidak ada saran
    preview:
      hint_static_frac: 0.95   # petunjuk pratinjau: baris / kolom di dalam kotak (dari garis potong) yang ≥ fraksi ini diam

# ── ISOLATE [1b] — SAM 2.1 hiera tiny (T-605, D-011) ─
# HANYA berjalan bila work/clips/<klip>/target/points.json ada (python -m rotoscope pick); tanpa itu dilewati.
# Memakai GPU → wajib --yes. Ambang cut (adegan) = stabilize.temporal.cut_diff di bawah.
isolate:
  model_id: "facebook/sam2.1-hiera-tiny"   # kode + bobot Apache-2.0; wajib diawali facebook/sam2.1-hiera-
  revision: "de431c4043854a71d8101e17995dfe596bf101a5"   # commit hash snapshot HF (pin T-602); wajib ada di cache HF
  precision: "fp32"          # "fp32" | "fp16" — TANPA bf16 (P-005); fp16 lebih lambat di GTX 1650 Ti (T-602)
  vram_min_free_mib: 2000    # reserved terukur 892 MiB (T-602, 92 frame); tumbuh ±2 MiB / frame / target
  ram_min_free_mib: 4096     # RAM bebas sebelum load (puncak proses T-602 3,7–4,8 GiB)
  mask_threshold: 0.0        # logit SAM > ambang = target (konvensi SAM: 0)

# ── SEGMENT [2] — Sapiens2-seg ─────────────────────
segment:
  model: "0.8b"              # "0.8b" | "0.4b" — eksplisit, untuk SELURUH klip (D-009)
  model_ids:
    "0.8b": "facebook/sapiens2-seg-0.8b"   # id HF yang dipakai di T-102c
    "0.4b": "facebook/sapiens2-seg-0.4b"
  revision:                  # commit hash snapshot HF per model (pin T-102b); wajib ada di cache HF
    "0.8b": "196a627b928676c4429b738ed76f78a21d96c4eb"
    "0.4b": "449b3c5335e6722bb94990abdd1aa6e612432f22"
  precision: "fp16"          # "fp16" | "fp32" — TANPA bf16 (P-005)
  vram_min_free_mib:
    "0.8b": 3300             # peak reserved 3276 MiB (T-102c)
    "0.4b": 2300             # peak reserved 2258 MiB
  probs_dtype: "uint8"       # round(p × 255), npz deflate

# ── DEPTH [2c] — Depth Anything V2 Small ───────────
depth:
  model_id: "depth-anything/Depth-Anything-V2-Small-hf"   # HANYA Small (Apache-2.0)
  revision: "5426e4f0f36572d16453bbda7a8389317b1bef99"   # commit hash snapshot HF (pin T-105); wajib ada di cache HF
  precision: "fp32"
  vram_min_free_mib: 500     # peak reserved 424 MiB

# ── QC (akhir stage [2]) ───────────────────────────
qc:
  area_min: 0.03             # fraksi frame
  area_max: 0.70
  iou_min: 0.55              # IoU foreground vs frame sebelumnya
  blob_min: 0.05             # komponen "besar" = > 5% area frame
  big_blobs_rule: transient  # T-305d: transient = gagal hanya bila jumlah blob besar NAIK SESAAT (run < transient_min_run
                             # frame, lebih tinggi dari run panjang terdekat); legacy = > max_big_blobs (lama, satu subjek);
                             # report = hanya dilaporkan, tidak pernah gagal
  max_big_blobs: 1           # hanya big_blobs_rule: legacy
  transient_min_run: 4       # frame, int ≥ 2; hanya big_blobs_rule: transient
  area_median_window: 49     # frame (±2 s); jendela DIGESER, bukan median klip. Jangan diubah tanpa kalibrasi
                             # ulang area_drop_min (W=25/49/73 memberi celah berbeda; W=73 tanpa celah)
  area_drop_min: 0.63        # SEMENTARA — T-102b, satu klip: celah aman 0.608 (MediaPipe kaki hilang) – 0.652 (Sapiens2)

# ── GROUPS (dipakai [3] dan [4]) ───────────────────
# Urutan = id grup (1..G); 0 = background (dicadangkan). Batas di dalam satu grup tidak digambar.
groups:
  hair: [Hair]
  face: [Face_Neck, Eyeglass, Lower_Lip, Upper_Lip, Lower_Teeth, Upper_Teeth, Tongue]
  torso: [Torso, Upper_Clothing, Apparel, Lower_Clothing]
  left_arm: [Left_Upper_Arm, Left_Lower_Arm, Left_Hand]
  right_arm: [Right_Upper_Arm, Right_Lower_Arm, Right_Hand]
  left_leg: [Left_Upper_Leg, Left_Lower_Leg, Left_Foot, Left_Shoe, Left_Sock]
  right_leg: [Right_Upper_Leg, Right_Lower_Leg, Right_Foot, Right_Shoe, Right_Sock]

# ── TARGET MASK — masker [1b] dipakai di [3] (T-606, D-012) ─
# Hanya bila target/points.json + isolate/ ada dan kunci [1b] cocok dengan titik + frame SEKARANG; selain itu [3] tanpa masker
# (+ PERINGATAN bila ada titik). Algoritma H per frame adegan berklik, SEBELUM kernel temporal. Satuan px = px kerja.
target_mask:
  enabled: true              # false = masker tidak pernah dipakai (sama dengan klip tanpa titik)
  r_keep: 0.9                # r = |komponen seg ∩ masker| / |komponen| ≥ ini → komponen utuh
  r_drop: 0.1                # r ≤ ini → komponen dibuang; di antaranya → dipotong mengikuti masker + dilate_px
  dilate_px: 4               # d: masker (lubang terisi) dilebarkan d px; d 8 / 12 dinilai lebih buruk (orang sebelah ikut)
  hole_fill_max_px: 0        # 0 = semua lubang masker diisi; N = hanya lubang ≤ N px
  piece_min_px: 30           # potongan hasil potong dengan < N px di dalam masker dibuang
  no_prompt: "keep"          # adegan tanpa klik: "keep" = digambar seperti biasa, "clear" = dikosongkan

# ── STABILIZE [3] ──────────────────────────────────
stabilize:
  temporal:
    enabled: true            # T-302: kernel simetris terpotong (tanpa optical flow: ditolak di T-303, docs/04); false = hanya spasial
    mask_ema_alpha: 0.7      # 1.0 = tanpa smoothing. Turun = lebih stabil, lebih lag
    boil_preserve: 0.3       # 0 = mati total, 1 = boiling penuh
    qc_fail_weight: 0.1      # SEMENTARA — bobot frame gagal QC di kernel; harus < ρ (0,176 pada α 0,7); klip kedua → T-305
    cut_diff: 0.06           # selisih abu-abu rata-rata antar frame (0–1) yang dianggap cut → jendela temporal dipotong; 0 = mati. 0,08 → 0,06 (keputusan Rio, label klip3: 7 / 7 cut, 1 FP diketahui; docs/04 "Kalibrasi cut_diff")
  island_min_px: 30          # N — filter pulau pada peta GRUP (T-102c: pada peta kelas → T-305)
  mode_k: 3                  # K — mode filter peta grup, background ikut
  depth:
    normalize: "log_median"  # T-302: log − median (tanpa IQR); "log_median_iqr" = kompatibilitas
    log_eps: 1.0e-6          # log(max(d, eps)) — hanya menahan disparity ≤ 0 (min klip uji 0.64)
    iqr_min: 0.01            # SEMENTARA — batas bawah pembagi IQR (log) foreground, dikalibrasi di T-302
    temporal: false          # EMA kedalaman; hanya berlaku kalau temporal.enabled. Tetap MATI (tanpa flow: ghost edge, id oklusi ×3; flow ditolak di T-303)
  hole_fill:
    enabled: true            # T-305f (VF): lubang background yang SELURUH cincinnya grup face → diisi face (sesudah kernel + mode filter, hanya peta grup; kedalaman tidak)

# ── VECTORIZE [4] ──────────────────────────────────
vectorize:
  min_region_area: 800       # px² — kontur luar foreground lebih kecil dibuang
  min_hole_area: 200         # px² — SEMENTARA, lubang siluet lebih kecil dibuang; dikalibrasi di T-305
  line_min_px: 5             # M — komponen garis 8-arah < M px dibuang, SEBELUM thinning
  min_stroke_px: 6           # jalur hasil tracing < 6 px dibuang
  depth_lines:
    blur_sigma: 1.0          # Gaussian σ (px) sebelum Sobel
    hi_pct: 95               # T_high = persentil per klip |grad depth_smooth|
    lo_pct: 90               # T_low  = persentil per klip
    erode_px: 5              # kernel erosi foreground untuk wilayah persentil
    min_dist_px: 7           # D — jarak minimum ke batas grup (termasuk siluet)
    min_len_px: 30           # L — panjang skeleton minimum
    min_dist_low_px: 2       # T-305b: D_low histeresis jarak (px kerja). 0 = mati; atau 1 ≤ D_low < D. Ujung oklusi boleh memanjang ke D_low (jalur ≤ ceil((D − D_low) / sin 45°) langkah)
    exclude_groups: [hair]   # T-305b: grup tanpa garis oklusi ([] = semua grup); group_boundary + siluet tidak terpengaruh
    hi_floor: 0              # T-305c: lantai absolut T_high (selisih depth_smooth / px). T_high dipakai = max(T_high persentil, hi_floor); T_low TIDAK disentuh. Default 0 (mati); 0,02 ditolak secara visual di klip3 (docs/04 "Keputusan akhir T-305c")
  track:
    max_match_dist_px: 16    # jarak Chamfer simetris maks pencocokan track_id (T-202; 12 → 16 disetujui Rio)

# ── EXPORT [6] ─────────────────────────────────────
export:
  source: "strokes"          # "strokes" (stage [5], default sejak T-203b; + out/svg/<nama>/) | "silhouette" (stable/groups, Phase 1)
  crf: 18                    # libx264, 0 (lossless) – 51; makin kecil makin tajam + besar
  preset: "medium"           # preset x264: ultrafast … veryslow
  foreground_color: "#000000"   # siluet (hanya source "silhouette")
  background_color: "#ffffff"   # latar kertas; juga warna pad 1 px kalau dimensi ganjil
  audio: false               # true = audio video sumber (aac, -shortest); error kalau sumber tanpa audio.
                             # Audio meme biasanya milik pihak ketiga → default tanpa audio; tambahkan audio
                             # berlisensi di editor platform (TikTok/CapCut)
  filename: "{source}.mp4"   # di paths.out_dir; {source} = nama video sumber (disanitasi). Hasil klip lain tidak ditimpa
