# Preset pencil-light (T-406): tipis, opacity rendah, tiga pass tipis, "grain" kuat lewat KERTAS bertekstur (tekstur garis ditolak, T-404b).
# Set kunci = rough-sketch.yaml (dijaga tests/test_presets.py). Jitter mati. offset / width_base = 2,7 / 4,5 = 0,6 (pegangan ≤ 0,6).
# Nilai FINAL (penilaian Rio 2026-10-08: varian "awal"). MP4 jauh lebih besar dari rough-sketch (tekstur kertas kuat).

# ── SHAPE ──────────────────────────────────────────
shape:
  simplify_epsilon: 2.8
  smooth_px: 5.0
  resample_points: 4
  smooth_tension: 0.5
  spline_steps: 8
  edge_mode: "hide"

# ── STROKE ─────────────────────────────────────────
stroke:
  width_base: 4.5
  width_variation: 0.6
  width_noise_scale: 0.036
  color: "#2b2b2b"
  opacity: 0.6
  cap: "round"
  taper_ends: true
  taper_px: 90
  taper_min: 0.3             # ujung runcing
  by_type:
    silhouette:      {width_scale: 1.0, opacity_scale: 1.0, taper_ends: null}
    silhouette_hole: {width_scale: 1.0, opacity_scale: 1.0, taper_ends: null}
    group_boundary:  {width_scale: 1.0, opacity_scale: 1.0, taper_ends: null}
    occlusion:       {width_scale: 1.0, opacity_scale: 0.8, taper_ends: null}

# ── JITTER ─────────────────────────────────────────
jitter:
  amplitude: 0.0             # MATI
  frequency: 0.053
  temporal_seed_mode: "frame"
  temporal_drift: 0.35
  param_seed: 0
  hold_frames: 2
  stroke_independence: 0.0

# ── MULTI-PASS ─────────────────────────────────────
multipass:
  enabled: true
  passes: 3
  offset: 2.7
  opacity_falloff: 0.6
  temporal_mode: "fixed"

# ── PAPER (disusun saat export) ────────────────────
paper:
  enabled: true
  color: "#f1eee6"
  texture_image: "assets/paper/rough_01.jpg"
  texture_opacity: 0.6       # grain kuat
  texture_gain: 4.5
  vignette: 0.0

# ── RENDER ─────────────────────────────────────────
render:
  ss: 3
  output_width: 1080
