# Preset heavy-marker (T-406): garis tebal, ujung tumpul, tiga pass bertumpuk — kesan spidol. Set kunci = rough-sketch.yaml
# (dijaga tests/test_presets.py). Jitter mati. offset / width_base = 5,5 / 12 = 0,46 (pegangan ≤ 0,6).
# Nilai FINAL (penilaian Rio 2026-10-08: varian "ringan": tebal 12, dua pass).

# ── SHAPE ──────────────────────────────────────────
shape:
  simplify_epsilon: 2.8
  smooth_px: 6.0
  resample_points: 4
  smooth_tension: 0.5
  spline_steps: 8
  edge_mode: "hide"

# ── STROKE ─────────────────────────────────────────
stroke:
  width_base: 12.0
  width_variation: 0.25      # spidol: variasi tebal kecil
  width_noise_scale: 0.036
  color: "#141414"
  opacity: 0.92
  cap: "round"
  taper_ends: true
  taper_px: 40               # taper pendek
  taper_min: 0.7             # ujung tetap tumpul
  by_type:
    silhouette:      {width_scale: 1.0, opacity_scale: 1.0, taper_ends: null}
    silhouette_hole: {width_scale: 1.0, opacity_scale: 1.0, taper_ends: null}
    group_boundary:  {width_scale: 1.0, opacity_scale: 1.0, taper_ends: null}
    occlusion:       {width_scale: 0.7, opacity_scale: 1.0, taper_ends: null}

# ── JITTER ─────────────────────────────────────────
jitter:
  amplitude: 0.0             # MATI
  frequency: 0.053
  temporal_seed_mode: "frame"
  temporal_drift: 0.35
  param_seed: 0
  hold_frames: 2
  stroke_independence: 0.0

# ── MULTI-PASS ─────────────────────────────────────
multipass:
  enabled: true
  passes: 2
  offset: 5.5
  opacity_falloff: 0.5
  temporal_mode: "fixed"

# ── PAPER (disusun saat export) ────────────────────
paper:
  enabled: true
  color: "#f4f1ea"
  texture_image: "assets/paper/rough_01.jpg"
  texture_opacity: 0.2
  texture_gain: 1.5
  vignette: 0.0

# ── RENDER ─────────────────────────────────────────
render:
  ss: 3
  output_width: 1080
