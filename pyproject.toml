[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rotoscope"
version = "0.1.0"
description = "Video meme -> animasi rotoscope bergaya sketsa outline"
requires-python = ">=3.11"
# Versi dependency dikunci di requirements.txt (sumber tunggal), bukan di sini.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
